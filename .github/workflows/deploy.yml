name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/brayan7897/ccap-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.ccapglobal.com/api/v1
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=542932674912-6hg2kkv5mibodjd5pof6nbsq7e471gin.apps.googleusercontent.com
            NEXT_PUBLIC_WHATSAPP_URL=${{ secrets.NEXT_PUBLIC_WHATSAPP_URL }}
            NEXT_PUBLIC_WHATSAPP_MESSAGE=${{ secrets.NEXT_PUBLIC_WHATSAPP_MESSAGE }}

      - name: Deploy to Kubernetes
        uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ secrets.KUBECONFIG_DATA }}

      - name: Update deployment image
        run: |
          kubectl set image deployment/ccap-app \
            ccap-app=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n brayan-ta

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/ccap-app -n brayan-ta --timeout=120s

      - name: Diagnose on failure
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n brayan-ta -l app=ccap-app
          echo "=== Describe deployment ==="
          kubectl describe deployment ccap-app -n brayan-ta
          echo "=== Pod events ==="
          kubectl get events -n brayan-ta --sort-by='.lastTimestamp' | tail -20
          echo "=== Pod logs ==="
          kubectl logs -l app=ccap-app -n brayan-ta --tail=50 || true
          kubectl logs -l app=ccap-app -n brayan-ta --previous --tail=50 || true
